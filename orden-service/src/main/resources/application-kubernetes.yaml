# ============================================
# APPLICATION CONFIGURATION FOR KUBERNETES
# ============================================
# Product Service - Configuración para Kubernetes

server:
  port: 8083

spring:
  application:
    name: orden-service

  # ============================================
  # DATASOURCE - OrdenDB
  # ============================================
  datasource:
    url: ${DB_URL:jdbc:postgresql://host.docker.internal:5435/ordendb}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${POOL_SIZE:10}
      minimum-idle: 5
      connection-timeout: 20000

  # ============================================
  # JPA CONFIGURATION
  # ============================================
  jpa:
    properties:
      "[hibernate.dialect]": org.hibernate.dialect.PostgreSQLDialect
      "[hibernate.format_sql]": true
      "[hibernate.jdbc.lob.non_contextual_creation]": true
    hibernate:
      ddl-auto: ${DDL_AUTO:validate}
    show-sql: ${SHOW_SQL:false}

# ============================================
# ACTUATOR (Para health checks de Kubernetes)
# ============================================
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
  health:
    livenessState:
      enabled: true
    readinessState:
      enabled: true

# ============================================
# LOGGING
# ============================================
logging:
  level:
    "[com.tecsup.app.micro.orden]": ${LOG_LEVEL:INFO}
    "[org.hibernate.SQL]": ${SQL_LOG_LEVEL:WARN}

# ============================================
# USER SERVICE URL - Comunicación entre servicios
# ============================================
# En Kubernetes, usar DNS interno
# Formato: http://<service-name>.<namespace>.svc.cluster.local
user:
  service:
    url: ${USER_SERVICE_URL:http://localhost:8081}

# ============================================
# PRODUCT SERVICE URL - Comunicación entre servicios
# ============================================
# En Kubernetes, usar DNS interno
# Formato: http://<service-name>.<namespace>.svc.cluster.local
product:
  service:
    url: ${PRODUCT_SERVICE_URL:http://localhost:8082}
